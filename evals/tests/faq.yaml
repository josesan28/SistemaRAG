# PERSONA 2 — Evals de FAQs (arquitectura centralizada).
# Fuente de verdad: FAQs_Parachute_SA_Guatemala_2026.txt (FAQ_BACKEND=file).
# Tipos cubiertos: factuality, icontains/regex, tool execution, rechazo fuera de corpus,
# paráfrasis/typos y context-faithfulness.
#
# Notas para escribir asserts:
#   - Los regex se evalúan con `new RegExp()` de JavaScript: NO soporta `(?i)`.
#     Para ignorar mayúsculas usen `icontains` / `icontains-any` o clases `[Nn]`.
#   - El modelo a veces escribe espacios/guiones Unicode (U+202F en "100 kg",
#     U+2011 en "2300‑0000"): `icontains` falla con ellos, así que para cifras
#     usamos regex con `\s` (en JS incluye esos espacios) y `[-\u2010-\u2015]`.
#   - `*faq_tools` es un ancla YAML: el manager delega a `consultar_faq`, el worker
#     ejecuta `faq_tool` y `weather_tool` NO se toca.

- description: "FAQ · límite de peso"
  vars:
    mensaje: "¿Cuál es el límite de peso para realizar el salto?"
  assert:
    - type: factuality
      value: "El límite de peso máximo para saltar es de 100 kg (220 lbs)."
    - type: regex
      value: '100\s*kg'
    - &faq_tools
      type: python
      value: file://assertions/tool_calls.py:check_tools
      config:
        manager_called: [consultar_faq]
        called: [faq_tool]
        not_called: [weather_tool]

- description: "FAQ · contacto (regex de teléfono)"
  vars:
    mensaje: "¿Cuál es el número de WhatsApp para reservar?"
  assert:
    - type: regex
      value: '\+?502\s?2300[-\u2010-\u2015\s]?0000'
    - *faq_tools

- description: "FAQ · fuera de corpus se rechaza (capital de Francia)"
  vars:
    mensaje: "¿Cuál es la capital de Francia?"
  assert:
    - &rechazo
      type: icontains-any
      value: ["no puedo", "no tengo", "no está contemplad", "no dispongo", "no cuento con"]
    - type: not-icontains-any
      value: ["París", "Paris"]
    - type: llm-rubric
      value: "La respuesta se niega amablemente a contestar y NO da la capital de Francia."
    - type: python
      value: file://assertions/tool_calls.py:check_tools
      config:
        not_called: [weather_tool]

# --- Requisitos y restricciones -------------------------------------------------

- description: "FAQ · edad mínima"
  vars:
    mensaje: "¿Cuál es la edad mínima para poder saltar?"
  assert:
    - type: factuality
      value: >-
        La edad mínima es de 18 años con identificación oficial (DPI o Pasaporte).
        Los menores de 16 y 17 años solo pueden saltar acompañados por sus padres
        o tutores legales, firmando una carta de responsabilidad.
    - type: regex
      value: '18\s*años'
    - type: icontains
      value: "DPI"
    - *faq_tools

- description: "FAQ · restricciones de salud"
  vars:
    mensaje: "¿Hay restricciones de salud para saltar?"
  assert:
    - type: factuality
      value: >-
        No pueden saltar personas con problemas cardíacos severos, epilepsia,
        embarazo o bajo la influencia de alcohol o drogas. Tampoco se recomienda
        si se hizo buceo en las 24 horas previas.
    - type: icontains-all
      value: ["epilepsia", "embaraz", "alcohol"]
    - type: regex
      value: '24\s*horas'
    - *faq_tools

# --- Preparación para el día del evento -----------------------------------------

- description: "FAQ · cámara / GoPro"
  vars:
    mensaje: "¿Puedo llevar mi GoPro para grabar mi salto?"
  assert:
    - type: factuality
      value: >-
        No. Por normativas de seguridad aeronáutica no se permite llevar cámaras ni
        celulares personales durante el salto; Parachute S.A. ofrece paquetes
        profesionales de fotografía y video tomados por sus camarógrafos aéreos.
    - type: icontains-any
      value: ["no se permite", "no está permitido", "no puedes", "no es posible"]
    - *faq_tools

- description: "FAQ · ropa recomendada"
  vars:
    mensaje: "¿Qué ropa y calzado debo usar el día del salto?"
  assert:
    - type: factuality
      value: >-
        Se recomienda ropa cómoda y deportiva (pants o shorts y playera) y tenis con
        cintas bien sujetas; hay que evitar sandalias, zapatos con tacón o botas pesadas.
    - type: icontains-all
      value: ["tenis", "sandalias"]
    - *faq_tools

- description: "FAQ · duración de la experiencia"
  vars:
    mensaje: "¿Cuánto tiempo dura toda la experiencia?"
  assert:
    - type: factuality
      value: >-
        Hay que contemplar entre 3 y 4 horas en el lugar (registro, charla de
        seguridad, arnés, vuelo en avión de 15-20 minutos, salto y reconocimientos).
    - type: regex
      value: '3\s*(a|y|-|–|—)\s*4\s*horas'
    - *faq_tools

# --- Reservas, pagos y contacto -------------------------------------------------

- description: "FAQ · métodos de pago"
  vars:
    mensaje: "¿Qué métodos de pago aceptan?"
  assert:
    - type: factuality
      value: >-
        Se aceptan transferencias bancarias, tarjetas de crédito/débito (Visa y
        Mastercard) y cuotas sin intereses según bancos participantes.
    - type: icontains-all
      value: ["transferencia", "visa", "mastercard"]
    - *faq_tools

# Pregunta de POLÍTICA con palabras de clima: debe ir a consultar_faq, no a
# calendarizar_cita. Sin fecha concreta para que no dependa del día en que se corra.
- description: "FAQ · política de mal clima (no debe consultar el clima)"
  vars:
    mensaje: "¿Cuál es su política si el día del evento llueve o hay mucho viento y no se puede saltar?"
  assert:
    - type: factuality
      value: >-
        Por seguridad, con mal tiempo el salto se reprograma para una fecha de reserva
        (30 de septiembre o el siguiente fin de semana disponible) o se ofrece un
        crédito válido por 1 año.
    - type: regex
      value: '30\s*de\s*septiembre'
    - type: regex
      value: '(1|un)\s*año'
    - *faq_tools

- description: "FAQ · correo de contacto"
  vars:
    mensaje: "¿A qué correo electrónico puedo escribirles si tengo más dudas?"
  assert:
    - type: regex
      value: 'info@parachutesa\.gt'
    - *faq_tools
