# PERSONA 2 — Evals de FAQs (arquitectura centralizada).
# Fuente de verdad: FAQs_Parachute_SA_Guatemala_2026.txt (FAQ_BACKEND=file).
# Tipos cubiertos: factuality, icontains/regex, tool execution, rechazo fuera de corpus,
# paráfrasis/typos y context-faithfulness.
#
# Notas para escribir asserts:
#   - Los regex se evalúan con `new RegExp()` de JavaScript: NO soporta `(?i)`.
#     Para ignorar mayúsculas usen `icontains` / `icontains-any` o clases `[Nn]`.
#   - El modelo a veces escribe espacios/guiones Unicode (U+202F en "100 kg",
#     U+2011 en "2300‑0000"): `icontains` falla con ellos, así que para cifras
#     usamos regex con `\s` (en JS incluye esos espacios) y `[-\u2010-\u2015]`.
#   - `*faq_tools` es un ancla YAML: el manager delega a `consultar_faq`, el worker
#     ejecuta `faq_tool` y `weather_tool` NO se toca.

- description: "FAQ · límite de peso"
  vars:
    mensaje: "¿Cuál es el límite de peso para realizar el salto?"
  assert:
    - type: factuality
      value: "El límite de peso máximo para saltar es de 100 kg (220 lbs)."
    - type: regex
      value: '100\s*kg'
    - &faq_tools
      type: python
      value: file://assertions/tool_calls.py:check_tools
      config:
        manager_called: [consultar_faq]
        called: [faq_tool]
        not_called: [weather_tool]

- description: "FAQ · contacto (regex de teléfono)"
  vars:
    mensaje: "¿Cuál es el número de WhatsApp para reservar?"
  assert:
    - type: regex
      value: '\+?502\s?2300[-\u2010-\u2015\s]?0000'
    - *faq_tools

- description: "FAQ · fuera de corpus se rechaza (capital de Francia)"
  vars:
    mensaje: "¿Cuál es la capital de Francia?"
  assert:
    - &rechazo
      type: icontains-any
      value: ["no puedo", "no tengo", "no está contemplad", "no dispongo", "no cuento con"]
    - type: not-icontains-any
      value: ["París", "Paris"]
    - type: llm-rubric
      value: "La respuesta se niega amablemente a contestar y NO da la capital de Francia."
    - type: python
      value: file://assertions/tool_calls.py:check_tools
      config:
        not_called: [weather_tool]
