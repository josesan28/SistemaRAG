services:
  db:
    image: pgvector/pgvector:pg16
    container_name: parachute_pgvector
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-parachute}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-parachute}
      POSTGRES_DB: ${POSTGRES_DB:-parachute_faqs}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-parachute} -d ${POSTGRES_DB:-parachute_faqs}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgvector_data: